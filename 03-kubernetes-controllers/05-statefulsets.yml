apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-statefulset
  labels:
    app: nginx
spec:
  replicas: 3
  serviceName: nginx-headless      # Must match the Headless Service name below
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
 
---
# ============================================================
# HEADLESS SERVICE — gives each pod its own stable DNS entry
# nginx-0.nginx-headless, nginx-1.nginx-headless, etc.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  selector:
    app: nginx
  clusterIP: None                  # This is what makes it headless
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

# ambassador-pod.yaml
# Pattern: Main container (nginx) talks to localhost:9000
# Ambassador container (socat) forwards that traffic to an external service
apiVersion: v1
kind: Pod
metadata:
  name: ambassador-pod
  labels:
    app: ambassador-pod
spec:
  containers:
    # Main container — talks to localhost:9000 thinking it's a local service
    - name: nginx
      image: nginx:1.25.3
      imagePullPolicy: Always
      ports:
        - containerPort: 80

    # Ambassador container — proxies localhost:9000 → external service (httpbin.org:80)
    - name: ambassador
      image: alpine/socat
      args:
        - TCP-LISTEN:9000,fork,reuseaddr
        - TCP:httpbin.org:80
      ports:
        - containerPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: ambassador-clusterip
spec:
  type: ClusterIP
  selector:
    app: ambassador-pod
  ports:
    - name: nginx
      protocol: TCP
      port: 80
      targetPort: 80
    - name: ambassador-proxy
      protocol: TCP
      port: 9000
      targetPort: 9000
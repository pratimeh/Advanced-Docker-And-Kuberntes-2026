# nginx-sidecar-simple.yaml
# Pattern: Sidecar monitors nginx over localhost (shared network namespace)
# No shared volume needed — containers talk via localhost
apiVersion: v1
kind: Pod
metadata:
  name: nginx-sidecar-simple
  labels:
    app: nginx-sidecar-simple
spec:
  containers:
    # Main container — nginx running on port 80
    - name: nginx
      image: nginx:1.25.3
      imagePullPolicy: Always
      ports:
        - containerPort: 80

    # Sidecar container — hits nginx on localhost:80 every 10 seconds
    # and logs the HTTP status. No volume, just shared localhost.
    - name: monitor
      image: busybox
      command:
        - /bin/sh
        - -c
        - |
          echo "Monitor sidecar started. Polling nginx on localhost:80..."
          while true; do
            STATUS=$(wget -q -O /dev/null -S http://localhost:80 2>&1 | grep "HTTP/" | awk '{print $2}')
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            if [ "$STATUS" = "200" ]; then
              echo "[$TIMESTAMP] nginx is UP — HTTP $STATUS"
            else
              echo "[$TIMESTAMP] nginx is DOWN or unreachable — HTTP $STATUS"
            fi
            sleep 10
          done

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-sidecar-simple-svc
spec:
  type: NodePort
  selector:
    app: nginx-sidecar-simple
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082